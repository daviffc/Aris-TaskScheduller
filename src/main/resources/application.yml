
spring:
  application:
    name: aris

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5455/aris}
    username: ${DB_USER:aris}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

aris:
  http-actions:
    enabled: ${ARIS_HTTP_ACTIONS_ENABLED:false}
    allowed-hosts: ${ARIS_HTTP_ALLOWED_HOSTS:}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
