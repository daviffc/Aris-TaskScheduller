
spring:
  application:
    name: aris

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5455/aris}
    username: ${DB_USER:aris}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
