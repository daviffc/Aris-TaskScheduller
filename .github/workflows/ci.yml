
name: Aris CI

on:
  push:
    branches:
      - main
      - "feat/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: build-and-test

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feat/cd-staging')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/daviffc/aris-taskscheduller:sha-${{ github.sha }}
            ghcr.io/daviffc/aris-taskscheduller:${{ github.ref == 'refs/heads/main' && 'main' || 'staging' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
